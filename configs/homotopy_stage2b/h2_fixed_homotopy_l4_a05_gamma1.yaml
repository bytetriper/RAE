# Homotopy Stage 2b — H2: Fixed homotopy, gamma=1
# Clean target: Norm(z_sem + 0.5 * (1-t)^1 * z_det)
# Purpose: smooth linear semantic-to-detail transition
# w_det(t) = (1-t): linear decrease from 1 (clean) to 0 (noise)

variant: "H2"
alpha: 0.5
gamma: 1          # linear homotopy
detail_layer: 4   # locked from Stage 2a STRONG_GO result

# Model (DiTDH-S, same for all variants)
hidden_size_enc: 384
hidden_size_dec: 2048
depth_enc: 12
depth_dec: 2
num_heads_enc: 6
num_heads_dec: 16

# Training
n_steps: 20000
batch_size: 128
lr: 1.0e-4
weight_decay: 0.0
warmup_steps: 1000
clip_grad: 1.0
ema_decay: 0.9999
precision: "bf16"

# Evaluation
val_every: 2000
sample_every: 4000
ckpt_every: 5000
num_val_steps: 20
sample_steps: 50
n_sample_classes: 8

# Data
max_val_images: 1000
