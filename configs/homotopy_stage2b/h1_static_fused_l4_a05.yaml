# Homotopy Stage 2b — H1: Static fused L4 baseline
# Clean target: Norm(z_sem + 0.5 * z_det)
# Purpose: test whether adding L4 residual detail helps at ALL timesteps
# This is the MOST IMPORTANT baseline — homotopy must beat it.

variant: "H1"
alpha: 0.5
gamma: 1          # unused for H1
detail_layer: 4   # locked from Stage 2a STRONG_GO result

# Model (DiTDH-S, same for all variants)
hidden_size_enc: 384
hidden_size_dec: 2048
depth_enc: 12
depth_dec: 2
num_heads_enc: 6
num_heads_dec: 16

# Training
n_steps: 20000
batch_size: 128
lr: 1.0e-4
weight_decay: 0.0
warmup_steps: 1000
clip_grad: 1.0
ema_decay: 0.9999
precision: "bf16"

# Evaluation
val_every: 2000
sample_every: 4000
ckpt_every: 5000
num_val_steps: 20
sample_steps: 50
n_sample_classes: 8

# Data
max_val_images: 1000
